<!doctype html>
<!--
	The page that runs the web browser build of snis_client (make WEB=1 web).
	See doc/web-client.txt.

	Query parameters (all optional):
		host	snis_server's host, as snis_web_gateway sees it (default: localhost)
		port	snis_server's port (default: 2501)
		lobby	use this lobby instead, and join the first server it lists
		setup	show snis_client's network setup screen instead
		ship	starship name (default: webship)
		pw	starship password (default: webpw)
		args	any other snis_client options, space separated, e.g. args=--navigation
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Nerds In Space</title>
<style>
	html, body { margin: 0; height: 100%; background: #000; color: #8f8; overflow: hidden;
		font-family: monospace; }
	#canvas { display: block; position: absolute; outline: none; }
	#status { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 18px; }
</style>
</head>
<body>
<div id="status">Loading Space Nerds In Space...</div>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
	var params = new URLSearchParams(location.search);
	var args = ['--no-launcher', '--no-splash-screen'];
	var ship = ['--starship', params.get('ship') || 'webship', '--pw', params.get('pw') || 'webpw'];

	if (params.has('setup'))
		; /* the client's own network setup screen */
	else if (params.get('lobby'))
		args = args.concat(['--lobbyhost', params.get('lobby'), '--quickstart'], ship);
	else
		args = args.concat(['--nolobby',
			'--serverhost', params.get('host') || 'localhost',
			'--serverport', params.get('port') || '2501'], ship);
	if (params.get('args'))
		args = args.concat(params.get('args').split(' ').filter(function(a) { return a.length; }));

	var statusElement = document.getElementById('status');
	var canvas = document.getElementById('canvas');

	if (!self.crossOriginIsolated)
		statusElement.textContent = 'This page must be served with the Cross-Origin-Opener-Policy ' +
			'and Cross-Origin-Embedder-Policy headers (see doc/web-client.txt).';

	var Module = {
		arguments: args,
		canvas: canvas,
		print: function(text) { console.log(text); },
		printErr: function(text) { console.warn(text); },
		setStatus: function(text) {
			if (text)
				statusElement.textContent = text;
		},
		onRuntimeInitialized: function() {
			statusElement.style.display = 'none';
			canvas.focus();
		},
	};
	canvas.addEventListener('click', function() { canvas.focus(); });

	/* The client draws at a fixed aspect ratio (its window's), as it does
	 * natively, where the window manager keeps the window to that shape.
	 * Here the page plays the window manager: show the canvas as large as
	 * fits, at the shape it is drawn, centred, rather than stretched.  The
	 * client sets the canvas's size itself, so check each frame. */
	function fit_canvas() {
		var w = innerWidth, h = innerHeight;

		if (canvas.width > 0 && canvas.height > 0) {
			if (w * canvas.height > h * canvas.width)
				w = Math.round(h * canvas.width / canvas.height);
			else
				h = Math.round(w * canvas.height / canvas.width);
			if (canvas.style.width != w + 'px' || canvas.style.height != h + 'px') {
				canvas.style.width = w + 'px';
				canvas.style.height = h + 'px';
				canvas.style.left = Math.floor((innerWidth - w) / 2) + 'px';
				canvas.style.top = Math.floor((innerHeight - h) / 2) + 'px';
			}
		}
		requestAnimationFrame(fit_canvas);
	}
	requestAnimationFrame(fit_canvas);
</script>
<script async src="snis_client.js"></script>
</body>
</html>
